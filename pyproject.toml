[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kwloader"
version = "1.3.0"
description = "Rich document loader for ODF, ODT, DOCX and DOTX files, including embedded images."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cloudberry Pi Technology" }]
dependencies = [
    "odfpy>=1.4.1,<2.0.0",
    "python-docx>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
